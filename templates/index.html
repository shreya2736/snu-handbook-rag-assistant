<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNU Chennai Handbook Assistant</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6fa; color: #1c2430; }
  header { background: #1f3a68; color: #fff; padding: 16px 20px; }
  header h1 { margin: 0; font-size: 1.2rem; }
  header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }
  main { max-width: 800px; margin: 0 auto; padding: 16px; }
  #chat { display: flex; flex-direction: column; gap: 12px; min-height: 55vh; padding-bottom: 12px; }
  .msg { padding: 12px 14px; border-radius: 12px; max-width: 90%; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1f3a68; color: #fff; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #dde3ee; }
  details { margin-top: 8px; font-size: .85rem; }
  summary { cursor: pointer; color: #1f3a68; font-weight: 600; }
  .src { margin-top: 6px; padding: 8px; background: #f4f6fa; border-left: 3px solid #1f3a68; border-radius: 4px; }
  .src b { display: block; margin-bottom: 4px; }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: #f4f6fa; padding: 10px 0; }
  input { flex: 1; padding: 12px; border: 1px solid #c5cddd; border-radius: 8px; font-size: 1rem; }
  button { padding: 12px 20px; border: 0; border-radius: 8px; background: #1f3a68; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: #fff; border: 1px solid #c5cddd; color: #1f3a68; padding: 6px 10px; font-size: .85rem; border-radius: 999px; }
  .note { font-size: .78rem; color: #5a6578; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>SNU Chennai Handbook Assistant</h1>
  <p>Ask about attendance, grading, exams, arrears and more. Answers come with sources.</p>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div id="chat"></div>
  <form id="form">
    <input id="q" placeholder="e.g. What is the minimum attendance required?" autocomplete="off" required>
    <button id="send">Ask</button>
  </form>
  <p class="note">AI-generated answers can be wrong. Always verify with the official regulations.</p>
</main>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const btn = document.getElementById("send");

["Minimum attendance required?", "What is the pass mark?", "CGPA for First Class with Distinction?",
 "Can I withdraw from an end-semester exam?"].forEach(t => {
  const c = document.createElement("button");
  c.type = "button"; c.className = "chip"; c.textContent = t;
  c.onclick = () => { input.value = t; form.requestSubmit(); };
  document.getElementById("chips").appendChild(c);
});

function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMsg(question, "user");
  input.value = ""; btn.disabled = true;
  const bot = addMsg("Searching the documents...", "bot");
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    bot.textContent = data.error || data.answer;
    if (data.sources && data.sources.length) {
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = `Sources (${data.sources.length})`;
      det.appendChild(sum);
      data.sources.forEach(s => {
        const box = document.createElement("div");
        box.className = "src";
        const title = document.createElement("b");
        title.textContent = `${s.source}, page ${s.page} (similarity ${s.score})`;
        const body = document.createElement("span");
        body.textContent = s.text;
        box.append(title, body);
        det.appendChild(box);
      });
      bot.appendChild(det);
    }
  } catch (err) {
    bot.textContent = "Could not reach the server.";
  }
  btn.disabled = false; input.focus();
});
</script>
</body>
</html>
